<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <title>Check-in - Phase Play</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23e85d04'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #161616; --ink-soft: #404040; --ink-faint: #6f6f6f; --line: #e3e3e3;
        --orange: #e85d04; --orange-deep: #c24e02; --orange-soft: #fbe3cf; --bg: #ffffff; --panel: #fafafa;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Barlow", system-ui, sans-serif; font-size: 17px; line-height: 1.45; }
      .wrap { max-width: 640px; margin: 0 auto; padding: 0 24px 120px; }
      header { padding: 26px 0 6px; }
      .kicker { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: 14px; color: var(--orange-deep); margin: 0; }
      h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(40px, 11vw, 56px); line-height: .95; margin: 4px 0 6px; }
      .lede { color: var(--ink-soft); margin: 0; }
      .h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .1em; font-size: 14px; color: var(--ink-faint); margin: 26px 0 8px; }

      .now { border: 1px solid var(--line); border-top: 4px solid var(--orange); border-radius: 0 0 10px 10px; padding: 14px 16px; margin-top: 18px; }
      .now .live { display: inline-flex; align-items: center; gap: 6px; font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--orange-deep); }
      .now .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); animation: blink 1.6s ease-in-out infinite; }
      @keyframes blink { 50% { opacity: .25; } }
      .now h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1; margin: 6px 0 4px; }
      .now p { margin: 0; color: var(--ink-soft); font-size: 15.5px; }

      .find { width: 100%; margin: 16px 0 10px; padding: 13px 14px; border: 1.5px solid var(--line); border-radius: 8px; font: 500 17px "Barlow", sans-serif; color: var(--ink); background: #fff; }
      .find:focus { outline: none; border-color: var(--ink); }
      .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
      .name { min-height: 54px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font: 600 17px "Barlow", sans-serif; text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
      .name.on { border-color: var(--orange); background: var(--orange-soft); box-shadow: inset 0 0 0 1px var(--orange); }
      .none { color: var(--ink-faint); margin: 8px 0; }

      .other { display: flex; flex-direction: column; gap: 8px; }
      .sess { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; width: 100%; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; font: inherit; color: inherit; cursor: pointer; }
      .sess b { font-weight: 700; }
      .sess small { grid-column: 1; color: var(--ink-faint); font-size: 14px; }
      .sess span { grid-row: 1 / span 2; grid-column: 2; color: var(--ink-faint); font-size: 22px; }

      .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 24px calc(12px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid var(--line); }
      .bar[hidden] { display: none; }
      .go { display: block; width: 100%; max-width: 592px; margin: 0 auto; min-height: 56px; border: 0; border-radius: 8px; background: var(--orange); color: #fff; font: 800 21px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .05em; cursor: pointer; }
      .go:disabled { opacity: .6; }

      .done { text-align: center; padding: 40px 0 10px; }
      .done .tick { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 50%; background: var(--orange); display: grid; place-items: center; }
      .done h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 38px; line-height: 1; margin: 0 0 8px; }
      .done p { margin: 0 0 4px; color: var(--ink-soft); }
      .again { margin-top: 26px; min-height: 52px; padding: 0 22px; border: 1.5px solid var(--ink); border-radius: 8px; background: #fff; color: var(--ink); font: 700 17px "Barlow", sans-serif; cursor: pointer; }
      .err { color: #b42318; font-weight: 600; margin: 10px 0; }
      .help { margin-top: 30px; font-size: 15px; color: var(--ink-faint); }
      .help a { color: var(--ink); }
      footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-faint); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <p class="kicker">Michael Nunes presents Phase Play</p>
        <h1>Check-in</h1>
        <p class="lede" id="lede">Tap your player's name, then tap check in. One tap per player.</p>
      </header>
      <div id="app"><p class="none">Loading the sessions...</p></div>
      <p class="help">Wrong name or a problem? Find a coach at the door, or text Coach Michael at <a href="sms:+15415310150" style="white-space:nowrap">541-531-0150</a>.</p>
      <footer>A Sportdork production</footer>
    </main>
    <div class="bar" id="bar" hidden><button class="go" id="go" type="button">Check in</button></div>
    <script>
      (function () {
        var API = 'https://yubopkxclvupxbeouhiu.supabase.co/functions/v1/phase-play';
        var app = document.getElementById('app'), bar = document.getElementById('bar'), go = document.getElementById('go'), lede = document.getElementById('lede');
        var sessions = [], current = null, picked = null, filter = '';

        function el(tag, attrs, kids) {
          var n = document.createElement(tag);
          Object.keys(attrs || {}).forEach(function (k) {
            if (k === 'text') n.textContent = attrs[k];
            else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { n.addEventListener(ev, attrs.on[ev]); });
            else n.setAttribute(k, attrs[k]);
          });
          (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
          return n;
        }
        function post(body) {
          return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) })
            .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
        }
        // The session running now (from 45 minutes before it starts), else the next one, else the last one.
        function liveKey() {
          var now = Date.now(), next = null;
          for (var i = 0; i < sessions.length; i++) {
            var s = sessions[i], a = Date.parse(s.start) - 45 * 60000, b = Date.parse(s.end);
            if (now >= a && now <= b) return s.key;
            if (!next && now < a) next = s.key;
          }
          return next || (sessions.length ? sessions[sessions.length - 1].key : null);
        }
        function isLive(s) { var now = Date.now(); return now >= Date.parse(s.start) - 45 * 60000 && now <= Date.parse(s.end); }
        function find(key) { for (var i = 0; i < sessions.length; i++) if (sessions[i].key === key) return sessions[i]; return null; }

        function render() {
          var s = find(current);
          app.innerHTML = '';
          bar.hidden = !picked;
          if (picked) go.textContent = 'Check in ' + picked.name;
          lede.hidden = false;
          if (!s) { app.appendChild(el('p', { class: 'none', text: 'No sessions found.' })); return; }
          app.appendChild(el('section', { class: 'now' }, [
            isLive(s) ? el('span', { class: 'live' }, [el('i'), 'Happening now']) : el('span', { class: 'live', text: s.day }),
            el('h2', { text: s.title }),
            el('p', { text: (isLive(s) ? s.day + ', ' : '') + s.time + (s.who ? ' - ' + s.who : '') })
          ]));
          var list = s.players;
          if (list.length > 8) {
            var input = el('input', { class: 'find', type: 'search', placeholder: 'Find your player', autocomplete: 'off', 'aria-label': 'Find your player', on: { input: function () { filter = input.value; drawNames(); } } });
            input.value = filter;
            app.appendChild(input);
          }
          var grid = el('div', { class: 'names', role: 'list' });
          app.appendChild(grid);
          function drawNames() {
            grid.innerHTML = '';
            var q = filter.trim().toLowerCase();
            var shown = list.filter(function (p) { return !q || p.name.toLowerCase().indexOf(q) !== -1; });
            if (!shown.length) grid.appendChild(el('p', { class: 'none', text: q ? 'No name matches. Try the first name.' : 'No players on this list yet.' }));
            shown.forEach(function (p) {
              grid.appendChild(el('button', { class: 'name' + (picked && picked.id === p.id ? ' on' : ''), type: 'button', role: 'listitem', 'aria-pressed': picked && picked.id === p.id ? 'true' : 'false', text: p.name, on: { click: function () {
                picked = picked && picked.id === p.id ? null : p; render();
              } } }));
            });
          }
          drawNames();
          var others = sessions.filter(function (x) { return x.key !== current; });
          if (others.length) {
            app.appendChild(el('p', { class: 'h2', text: 'Other sessions' }));
            app.appendChild(el('div', { class: 'other' }, others.map(function (x) {
              return el('button', { class: 'sess', type: 'button', on: { click: function () { current = x.key; picked = null; filter = ''; render(); window.scrollTo(0, 0); } } }, [
                el('b', { text: x.title }), el('small', { text: x.day + ', ' + x.time }), el('span', { 'aria-hidden': 'true', text: '›' })
              ]);
            })));
          }
        }

        function confirmDone(res) {
          bar.hidden = true; lede.hidden = true;
          app.innerHTML = '';
          var svg = '<svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M10 21l7 7 14-15" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          var tick = el('div', { class: 'tick' }); tick.innerHTML = svg;
          app.appendChild(el('section', { class: 'done', role: 'status' }, [
            tick,
            el('h2', { text: res.name + (res.already ? ' is already checked in' : ' is checked in') }),
            el('p', { text: res.session + ', ' + res.time }),
            el('p', { text: res.day }),
            el('button', { class: 'again', type: 'button', text: 'Check in another player', on: { click: function () { picked = null; filter = ''; render(); window.scrollTo(0, 0); } } })
          ]));
          window.scrollTo(0, 0);
        }

        go.addEventListener('click', function () {
          if (!picked) return;
          go.disabled = true; go.textContent = 'Checking in...';
          post({ action: 'check_in', id: picked.id, session: current }).then(function (r) {
            go.disabled = false;
            if (r.status === 200 && r.body.ok) { picked = null; confirmDone(r.body); return; }
            go.textContent = 'Try again';
            var e = app.querySelector('.err') || app.insertBefore(el('p', { class: 'err' }), app.firstChild);
            e.textContent = r.body && r.body.error === 'not_on_list' ? 'That name is not on this session list. Please find a coach.' : 'Could not check in. Please try again.';
          }).catch(function () {
            go.disabled = false; go.textContent = 'Try again';
            var e = app.querySelector('.err') || app.insertBefore(el('p', { class: 'err' }), app.firstChild);
            e.textContent = 'No connection. Please try again.';
          });
        });

        function load() {
          post({ action: 'checkin_roster' }).then(function (r) {
            if (r.status !== 200 || !r.body.sessions) throw new Error('load');
            sessions = r.body.sessions;
            current = liveKey();
            render();
          }).catch(function () {
            app.innerHTML = '';
            app.appendChild(el('p', { class: 'err', text: 'Could not load the sessions. Check your connection.' }));
            app.appendChild(el('button', { class: 'again', type: 'button', text: 'Try again', on: { click: load } }));
          });
        }
        load();
      })();
    </script>
  </body>
</html>
