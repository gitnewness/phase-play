<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="color-scheme" content="light" />
    <title>Check-in Sign - Phase Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@800&family=Barlow:wght@700&display=swap" rel="stylesheet" />
    <style>
      /* One 8.5 x 11 in page: "Check in" and the QR code, nothing else. */
      @page { size: 8.5in 11in; margin: 0; }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: #fff; color: #161616; }
      .sign { width: 8.5in; height: 11in; margin: 0 auto; padding: 0.75in; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.5in; overflow: hidden; }
      h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 1.9in; line-height: .9; letter-spacing: .01em; margin: 0; white-space: nowrap; }
      .qr { display: block; width: 6.4in; height: 6.4in; padding: 0.25in; border: 0.08in solid #e85d04; border-radius: 0.25in; }
      .print { position: fixed; top: 16px; right: 16px; padding: 12px 22px; border: 0; border-radius: 8px; background: #161616; color: #fff; font: 700 17px "Barlow", sans-serif; cursor: pointer; }
      @media screen { body { background: #e9e9e9; padding: 24px 0; } .sign { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.15); } }
      @media print { .print { display: none; } html, body { width: 8.5in; height: 11in; } }
    </style>
  </head>
  <body>
    <div class="sign">
      <h1>Check in</h1>
      <img class="qr" src="/images/check-in-qr.svg" alt="QR code for phaseplayhoops.com/check-in" />
    </div>
    <button class="print" type="button" onclick="window.print()">Print</button>
  </body>
</html>
