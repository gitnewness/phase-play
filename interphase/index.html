<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <title>Interphase — Phase Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ink: #161616; --ink-soft: #404040; --ink-faint: #6f6f6f; --line: #e3e3e3;
        --orange: #e85d04; --orange-deep: #c24e02; --orange-soft: #fbe3cf; --bg: #ffffff; --panel: #fafafa;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Barlow", system-ui, sans-serif; font-size: 16px; line-height: 1.45; }
      .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 60px; }
      header.top { padding: 22px 0 8px; }
      .kicker { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: 14px; color: var(--orange-deep); }
      h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(36px, 9vw, 52px); line-height: .95; margin: 6px 0 4px; }
      h1 span { color: var(--orange); }
      .sub { color: var(--ink-soft); margin: 0; }
      .overall { margin: 16px 0 6px; }
      .bar { height: 10px; border-radius: 999px; background: #eee; overflow: hidden; }
      .bar i { display: block; height: 100%; width: 0; background: var(--orange); border-radius: 999px; transition: width .5s ease; }
      .overall-txt { display: flex; justify-content: space-between; font-size: 14px; color: var(--ink-faint); margin-top: 6px; }
      .group { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 22px; margin: 30px 0 8px; padding-top: 14px; border-top: 2px solid var(--ink); }
      .block { border: 1px solid var(--line); border-top: 4px solid var(--orange); border-radius: 0 0 10px 10px; background: #fff; margin: 0 0 16px; }
      .block-head { width: 100%; text-align: left; border: 0; background: none; padding: 14px 16px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; font: inherit; color: inherit; }
      .block-title { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 21px; line-height: 1.05; }
      .block-focus { grid-column: 1 / -1; font-size: 14.5px; color: var(--ink-soft); }
      .watch { display: flex; align-items: center; gap: 8px; margin: 0 16px 12px; padding: 9px 14px; border: 1.5px solid var(--ink); border-radius: 999px; background: #fff; color: var(--ink); font: 700 15px "Barlow", sans-serif; cursor: pointer; }
      .watch .play { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--orange); color: #fff; font-size: 11px; padding-left: 2px; flex-shrink: 0; }
      .watch.on { background: var(--ink); color: #fff; }
      .vid { margin: 0 16px 14px; }
      .vid-frame { position: relative; width: 100%; max-width: 340px; margin: 0 auto; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; overflow: hidden; }
      .vid-frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
      .block-count { font-weight: 700; font-size: 14px; color: var(--orange-deep); white-space: nowrap; }
      .sessions { display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; padding: 0 16px 14px; }
      .s { height: 34px; border-radius: 999px; border: 1.5px solid #dedede; background: #f1f1f1; font: 700 13px "Barlow", sans-serif; color: var(--ink-faint); cursor: pointer; padding: 0; }
      .s.done { background: var(--orange); border-color: var(--orange); color: #fff; }
      .s.sel { outline: 3px solid var(--ink); outline-offset: 1px; }
      .body { padding: 0 16px 16px; border-top: 1px solid var(--line); }
      .body[hidden] { display: none; }
      .sess-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px; margin: 12px 0 6px; }
      .sess-head b { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 18px; }
      .sess-head span { font-size: 14px; color: var(--ink-faint); }
      .lvl { display: flex; gap: 8px; margin: 4px 0 10px; }
      .lvl button { flex: 1; font: 700 15px "Barlow", sans-serif; padding: 10px 8px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
      .lvl button.on { background: var(--orange); border-color: var(--orange); color: #fff; }
      .lvl button:disabled { opacity: .4; cursor: default; }
      .sets { font-size: 14px; font-weight: 600; color: var(--orange-deep); margin: 0 0 6px; }
      .col-label { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: 14px; color: var(--ink-faint); margin: 12px 0 2px; }
      ul.drills { list-style: none; margin: 0; padding: 0; }
      ul.drills li { border-bottom: 1px solid #f0f0f0; }
      ul.drills label { display: flex; align-items: flex-start; gap: 12px; padding: 10px 2px; cursor: pointer; }
      ul.drills input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--orange); flex-shrink: 0; }
      ul.drills .reps { font-weight: 700; min-width: 3.2em; display: inline-block; }
      ul.drills input:checked + span { color: var(--ink-faint); text-decoration: line-through; }
      .test { margin: 14px 0 0; padding: 12px; background: var(--orange-soft); border-radius: 8px; }
      .test label { font-weight: 600; display: block; margin-bottom: 6px; }
      .test input { width: 90px; font: inherit; font-size: 18px; padding: 8px 10px; border: 1px solid #e0b58f; border-radius: 8px; }
      textarea { width: 100%; min-height: 70px; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-top: 4px; resize: vertical; }
      .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px; }
      .btn { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; font-size: 18px; border: 0; border-radius: 8px; padding: 12px 18px; cursor: pointer; background: var(--orange); color: #fff; }
      .btn.alt { background: #f1f1f1; color: var(--ink); }
      .btn:disabled { opacity: .5; cursor: default; }
      .saved { font-size: 14px; color: var(--ink-faint); }
      .hint { font-size: 14px; color: var(--ink-faint); margin: 8px 0 0; }
      .hint[hidden] { display: none; }
      .msg { margin: 40px 0; padding: 18px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
      .msg h2 { font-family: "Barlow Condensed", sans-serif; text-transform: uppercase; margin: 0 0 6px; }

      /* ===== THE 100 shooting test ===== */
      .t100 { border: 2px solid var(--ink); border-radius: 12px; padding: 16px; margin: 20px 0 6px; background: #111; color: #fff; }
      .t100 .kicker { color: #ffa25e; }
      .t100 h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; margin: 2px 0 4px; line-height: 1; }
      .t100 p { margin: 0 0 10px; color: #c8c8c8; font-size: 15px; }
      .t100-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 12px; }
      .t100-stat { background: #1c1c1c; border-radius: 8px; padding: 10px; text-align: center; }
      .t100-stat b { display: block; font-family: "Barlow Condensed", sans-serif; font-size: 30px; line-height: 1; color: #fff; }
      .t100-stat span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #9a9a9a; }
      .t100-hist { margin-top: 12px; font-size: 14px; color: #c8c8c8; }
      .t100-hist div { display: flex; justify-content: space-between; border-top: 1px solid #2a2a2a; padding: 6px 0; }
      .scorer[hidden] { display: none; }
      .scorer { position: fixed; inset: 0; z-index: 50; background: #111; color: #fff; display: flex; flex-direction: column; padding: 16px max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); overflow-y: auto; }
      .sc-top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: #9a9a9a; }
      .sc-x { background: #2a2a2a; color: #fff; border: 0; border-radius: 8px; padding: 8px 12px; font: 700 14px "Barlow", sans-serif; cursor: pointer; }
      .sc-name { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(38px, 11vw, 60px); line-height: .95; margin: 14px 0 2px; }
      .sc-sub { font-family: "Barlow Condensed", sans-serif; font-weight: 700; letter-spacing: .12em; color: #ffa25e; text-transform: uppercase; }
      .sc-prog { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 12px 0; }
      .sc-prog i { height: 6px; border-radius: 3px; background: #333; }
      .sc-prog i.done { background: var(--orange); }
      .sc-prog i.cur { background: #fff; }
      .sc-dots { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; margin: 8px 0 4px; }
      .sc-dots i { aspect-ratio: 1; border-radius: 50%; border: 2px solid #444; display: grid; place-items: center; font: 800 13px "Barlow", sans-serif; font-style: normal; }
      .sc-dots i.p0 { background: #3a1212; border-color: #7a2a2a; color: #e08080; }
      .sc-dots i.p1 { background: #2a3550; border-color: #4a6aa8; }
      .sc-dots i.p2 { background: #5a3d10; border-color: #e09a1a; }
      .sc-dots i.p3 { background: #0f4a2a; border-color: #00d26a; }
      .sc-live { display: flex; justify-content: space-between; font-size: 15px; color: #c8c8c8; margin: 6px 0 14px; }
      .sc-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: auto; }
      .sc-btn { border: 0; border-radius: 12px; padding: 18px 6px; color: #fff; cursor: pointer; font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 22px; line-height: 1; touch-action: manipulation; }
      .sc-btn small { display: block; font-family: "Barlow", sans-serif; font-weight: 600; font-size: 12px; text-transform: none; opacity: .85; margin-top: 6px; letter-spacing: 0; }
      .sc-btn.z1 { background: #3a5fa8; } .sc-btn.z2 { background: #c98a12; } .sc-btn.z3 { background: #0e9f55; }
      .sc-btn.miss { grid-column: 1 / -1; background: #b3261e; padding: 22px; font-size: 26px; }
      .sc-row { display: flex; gap: 10px; margin-top: 10px; }
      .sc-row button { flex: 1; }
      .sc-ghost { background: #2a2a2a; color: #fff; border: 0; border-radius: 10px; padding: 14px; font: 800 16px "Barlow Condensed", sans-serif; text-transform: uppercase; letter-spacing: .04em; cursor: pointer; }
      .sc-ghost:disabled { opacity: .4; }
      .rc-big { text-align: center; margin: 18px 0 8px; }
      .rc-big b { font-family: "Barlow Condensed", sans-serif; font-size: 96px; line-height: .9; color: #ffa25e; }
      .rc-big span { display: block; letter-spacing: .12em; text-transform: uppercase; font-size: 13px; color: #9a9a9a; }
      .rc-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
      .rc-st { display: flex; justify-content: space-between; border-top: 1px solid #2a2a2a; padding: 8px 0; font-size: 15px; }
      .rc-st em { font-style: normal; color: #9a9a9a; }
      footer { text-align: center; color: var(--ink-faint); font-size: 13px; margin-top: 30px; }
      @media (max-width: 420px) { .s { height: 30px; font-size: 12px; } .sessions { gap: 4px; } }
    </style>
  </head>
  <body>
    <main class="wrap" id="app" aria-live="polite">
      <header class="top">
        <div class="kicker">Phase Play · Interphase</div>
        <h1>Foundational <span>Skill Building</span></h1>
        <p class="sub" id="hello">Loading your workout…</p>
      </header>
    </main>

    <script>
      (function () {
        var API = 'https://yubopkxclvupxbeouhiu.supabase.co/functions/v1/phase-play';
        // Workout content, from Coach Michael's "Basketball Daily Workout Program".
        var PROGRAM = [
          { group: 'Daily Ball Handling — Focus on Offhand Positioning', blocks: [
            // Stationary has levels: each session is done as 1-ball (Level 1) or 2-ball (Level 2).
            { key: 'stationary', title: 'Stationary Ball Handling — Square Stance', focus: 'Focus on broad base and body rhythm', levels: {
              1: { name: '1 Ball', sets: 'Level 1 · 1 ball.', cols: [
                { drills: ['25x|Pound (R/L)', '25x|V-Dribble (R/L)', '25x|Crossovers', '25x|Swing the Purse (R/L)'] },
                { drills: ['10x|Pound Cross Pound', '10x|V Cross Pound', '10x|InOut Cross', '10x|Cross Tween (R/L)', '10x|Pound Cross Tween', '10x|Cross Tween Behind', '10x|V Cross Tween Behind'] } ] },
              2: { name: '2 Ball', sets: 'Level 2 · 2 balls.', cols: [
                { drills: ['25x|Pound Sync', '25x|Pound Alternate', '25x|V-Sync', '25x|V-Alternate', '25x|Swing the Purse Sync', '25x|Swing the Purse Alternate'] },
                { drills: ['10x|Cross Clockwise', '10x|Cross Alternate', '10x|Tween Alternate', '4x|Figure 8 Forward', '4x|Figure 8 Reverse', '1x|Piano Dribble Set'] } ] } } },
            { key: 'motion', title: 'Motion Combos', focus: 'Focus on wide moving stance and tight dribble path (use a passing partner between combos, if available)', sets: '1 ball only. Take 1 small step each dribble.', cols: [
              { drills: ['10x|Pound Cross Pound (Loop)', '5x|Pound Tween Cross (L/R)', '5x|Pound Cross Tween (L/R)'] },
              { drills: ['10x|Pound Cross Tween Behind (Loop)', '10x|V Cross Tween Behind (Loop)', '10x|InOut Cross Tween Behind (Loop)'] } ] }
          ] },
          { group: 'Daily Shooting Drills', blocks: [
            { key: 'form', title: 'Form Shooting', focus: 'Focus on efficient ball to shot path and follow through', cols: [
              { drills: ['10x|1-Hand Form Shot (3-Ft)', '10x|1-Hand Form Shot (6-Ft)', '10x|2-Hand Form Shot (12-Ft)', '10x|2-Hand Form Shot (15-Ft)'] },
              { drills: ['5x|Right Dribble Step Approach (1-2 Step)', '5x|Left Dribble Step Approach (1-2 Step)', '5x|Right Dribble Step Approach (Step Hop)', '5x|Left Dribble Step Approach (Step Hop)'] } ] },
            { key: 'pickup', title: 'Pickup Series', focus: 'Focus on dribble outside foot and pickup at hip level', cols: [
              { drills: ['5 makes|Right Pound Pickup', '5 makes|Left Pound Pickup', '5 makes|Right Split Pound Pickup', '5 makes|Left Split Pound Pickup'] },
              { drills: ['5 makes|Left to Right Split Tween', '5 makes|Right to Left Split Tween', '5 makes|Left to Right Pound Tween', '5 makes|Right to Left Pound Tween'] } ] },
            { key: 'pullup', title: 'Pullup Series', focus: 'Focus on off hand lift into protection & pickup', test: 'Accuracy test — 10x alternating 1-dribble pull-up elbow jumpers (from center 3-pt line). Makes out of 10:', cols: [
              { label: 'Sweep Series (Center 3-Point Line)', drills: ['5 makes|Left Elbow — 1-Dribble Pivot to Square (Inside Out)', '5 makes|Left Elbow — 1-Dribble Jump Stop to Square (Hop Foot Replacement)', '5 makes|Left Elbow — 1-Dribble Step Back', '5 makes|Right Elbow — 1-Dribble Pivot to Square (Inside Out)', '5 makes|Right Elbow — 1-Dribble Jump Stop to Square (Hop Foot Replacement)', '5 makes|Right Elbow — 1-Dribble Step Back'] },
              { label: 'Jab Series (Center 3-Point Line)', drills: ['5 makes|Left Elbow — 1-Dribble Pivot to Square (Inside Out)', '5 makes|Left Elbow — 1-Dribble Jump Stop to Square (Hop Foot Replacement)', '5 makes|Left Elbow — 1-Dribble Step Back', '5 makes|Right Elbow — 1-Dribble Pivot to Square (Inside Out)', '5 makes|Right Elbow — 1-Dribble Jump Stop to Square (Hop Foot Replacement)', '5 makes|Right Elbow — 1-Dribble Step Back'] } ] }
          ] },
          { group: 'Combo Finishing Drills', blocks: [
            { key: 'finishing', title: 'Rollup Reverse Pivot Finishing', focus: 'Focus on accelerated footwork and high glass finishes', cols: [
              { label: 'Sweep Series (Center 17-Ft)', drills: ['5x|Reverse Pivot + Pickup + Extend Lay', '5x|Reverse Pivot + Pickup + Classic Lay', '5x|Reverse Pivot + Tuck Hop + Classic Lay', '5x|Reverse Pivot + Tuck Hop + Cross Step', '5x|Reverse Pivot Stretch Spin + Pickup Lay', '5x|Reverse Pivot Stretch Spin + Cross Step'] },
              { label: 'Jab Series (Center 17-Ft)', drills: ['5x|Reverse Pivot + Pickup + Extend Lay', '5x|Reverse Pivot + Pickup + Classic Lay', '5x|Reverse Pivot + Tuck Hop + Classic Lay', '5x|Reverse Pivot + Tuck Hop + Cross Step', '5x|Reverse Pivot Stretch Spin + Pickup Lay', '5x|Reverse Pivot Stretch Spin + Cross Step'] } ] }
          ] },
          { group: 'Daily Passing Drills', blocks: [
            { key: 'passing', title: 'Dribble Catch Passing', focus: 'Focus on offhand position and driving pass with elbow below hand', cols: [
              { drills: ['15x|Left Hand — Pound & Pass', '15x|Right Hand — Pound & Pass', '15x|Cross Front Clockwise — Pound Cross & Pass', '15x|Cross Front Counter Clockwise — Pound Cross & Pass'] },
              { drills: ['15x|Cross Between Legs Clockwise — Pound Cross & Pass', '15x|Cross Between Legs Counter Clockwise — Pound Cross & Pass', '15x|Cross Behind Back Clockwise — Pound Cross & Pass', '15x|Cross Behind Back Counter Clockwise — Pound Cross & Pass'] } ] }
          ] }
        ];
        var SESSIONS = 10;
        var app = document.getElementById('app');
        var hello = document.getElementById('hello');
        var token = (location.hash.match(/k=([A-Za-z0-9]+)/) || [])[1] || '';
        var state = {}; // key -> { n: {completed_on, drills:[], test_score, notes} }
        var selected = {}; // key -> session no
        var open = {};

        function el(tag, attrs, kids) {
          var n = document.createElement(tag);
          Object.keys(attrs || {}).forEach(function (k) {
            if (k === 'text') n.textContent = attrs[k];
            else if (k === 'on') Object.keys(attrs.on).forEach(function (ev) { n.addEventListener(ev, attrs.on[ev]); });
            else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k] === true ? '' : attrs[k]);
          });
          (kids || []).forEach(function (c) { if (c != null) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
          return n;
        }
        function call(body) {
          return fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: token }, body)) })
            .then(function (r) { return r.json().then(function (j) { return { status: r.status, body: j }; }); });
        }
        function today() {
          var d = new Date();
          return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }
        function fmt(iso) {
          if (!iso) return '';
          var p = iso.split('-');
          return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
        }
        function blocks() { var a = []; PROGRAM.forEach(function (g) { g.blocks.forEach(function (b) { a.push(b); }); }); return a; }
        function sess(key, n) { state[key] = state[key] || {}; return state[key][n] || (state[key][n] = { completed_on: null, drills: [], test_score: null, notes: '' }); }
        // Level for a Stationary session: what it was saved as, else the level of the latest finished session, else 1.
        function lvlOf(b, n) {
          if (!b.levels) return null;
          var s = sess(b.key, n);
          if (s.level) return s.level;
          for (var i = SESSIONS; i >= 1; i--) { var x = (state[b.key] || {})[i]; if (x && x.completed_on && x.level) return x.level; }
          return 1;
        }
        // The block as shown for one session: for Stationary, that level's drills.
        function view(b, n) { return b.levels ? Object.assign({}, b, b.levels[lvlOf(b, n)]) : b; }
        function totalDrills(b) { var t = 0; b.cols.forEach(function (c) { t += c.drills.length; }); return t; }
        function doneCount(key) { var s = state[key] || {}, c = 0; for (var i = 1; i <= SESSIONS; i++) if (s[i] && s[i].completed_on) c++; return c; }
        function nextOpen(key) { for (var i = 1; i <= SESSIONS; i++) if (!sess(key, i).completed_on) return i; return SESSIONS; }

        function fail(title, text) {
          hello.textContent = '';
          app.appendChild(el('div', { class: 'msg' }, [el('h2', { text: title }), el('p', { text: text })]));
        }
        if (!token) { fail('Use your personal link', 'Open this page from the private Interphase link Coach Michael sent you. Questions? Text 541-531-0150.'); return; }

        call({ action: 'ip_load' }).then(function (r) {
          if (r.status !== 200) { fail('This link isn’t active', 'Ask Coach Michael for a new Interphase link. Text 541-531-0150.'); return; }
          (r.body.sessions || []).forEach(function (s) {
            var x = sess(s.block_key, s.session_no);
            x.completed_on = s.completed_on; x.level = s.level || null; x.drills = s.drills || []; x.test_score = s.test_score; x.notes = s.notes || '';
          });
          tests = r.body.tests || [];
          hello.textContent = 'Welcome, ' + r.body.player + ' (' + r.body.cohort.replace('/', ' / ') + '). Work through each section and check off your drills. Your progress saves automatically.';
          blocks().forEach(function (b) { selected[b.key] = nextOpen(b.key); });
          render();
        }).catch(function () { fail('Can’t connect', 'Check your internet connection and reload the page.'); });


        // ===== THE 100 shooting test (from HOOPWORK) =====
        var STATIONS = [
          { id: 'classic_r', name: 'Classic Layup', sub: 'Right Hand', type: 'layup' },
          { id: 'classic_l', name: 'Classic Layup', sub: 'Left Hand', type: 'layup' },
          { id: 'ext_r', name: 'Extension', sub: 'Right Hand', type: 'layup' },
          { id: 'ext_l', name: 'Extension', sub: 'Left Hand', type: 'layup' },
          { id: 'rev_r', name: 'Reverse Layup', sub: 'Right Hand', type: 'layup' },
          { id: 'rev_l', name: 'Reverse Layup', sub: 'Left Hand', type: 'layup' },
          { id: 'ft10', name: '10 Feet', sub: 'Jumper', type: 'jumper' },
          { id: 'ft15', name: '15 Feet', sub: 'Jumper', type: 'jumper' },
          { id: 'ft20', name: '20 Feet', sub: 'Jumper', type: 'jumper' },
          { id: 'ft_free', name: 'Free Throw', sub: 'The Line', type: 'jumper' }
        ];
        var ZONES = {
          layup: [['Low', 'Low glass'], ['Mid', 'Clean or mid glass'], ['Crown', 'Top of the square']],
          jumper: [['Make', 'Goes in, any way'], ['Swish', 'Nothing but net'], ['BRD', 'Dead center']]
        };
        var tests = [];
        function summarize(shots) {
          var makes = 0, pts = 0;
          STATIONS.forEach(function (st) { (shots[st.id] || []).forEach(function (v) { if (v > 0) { makes++; pts += v; } }); });
          var taken = 0; STATIONS.forEach(function (st) { taken += (shots[st.id] || []).length; });
          var pct = taken ? makes / taken * 100 : 0;
          return { makes: makes, points: pts, ovr: Math.min(100, Math.round(pts * pct / 100 / 2)), taken: taken };
        }
        function testCard() {
          var last = tests[tests.length - 1];
          var best = tests.reduce(function (b, t) { return !b || t.makes > b.makes ? t : b; }, null);
          var card = el('section', { class: 't100' }, [
            el('div', { class: 'kicker', text: 'Testing' }),
            el('h2', { text: 'The 100' }),
            el('p', { text: '10 stations × 10 shots. Tap a make by how clean it was (1–3 points) or a miss. Score out of 100.' })
          ]);
          if (last) {
            card.appendChild(el('div', { class: 't100-stats' }, [
              el('div', { class: 't100-stat' }, [el('b', { text: String(last.makes) }), el('span', { text: 'Last / 100' })]),
              el('div', { class: 't100-stat' }, [el('b', { text: String(best.makes) }), el('span', { text: 'Best / 100' })]),
              el('div', { class: 't100-stat' }, [el('b', { text: String(last.ovr) }), el('span', { text: 'Last OVR' })])
            ]));
          }
          card.appendChild(el('button', { class: 'btn', type: 'button', text: tests.length ? 'Start a new test' : 'Start your first test', on: { click: startTest } }));
          if (tests.length) {
            var hist = el('div', { class: 't100-hist' });
            tests.slice().reverse().slice(0, 6).forEach(function (t) {
              hist.appendChild(el('div', {}, [el('span', { text: new Date(t.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + (t.scored_by === 'coach' ? ' · scored by coach' : '') }), el('span', { text: t.makes + ' / 100 · ' + t.points + ' pts · OVR ' + t.ovr })]));
            });
            card.appendChild(hist);
          }
          return card;
        }

        var scorer = null, run = null;
        function startTest() {
          run = { idx: 0, shots: {}, history: [] };
          STATIONS.forEach(function (st) { run.shots[st.id] = []; });
          if (!scorer) { scorer = el('div', { class: 'scorer', role: 'dialog', 'aria-label': 'The 100 test' }); document.body.appendChild(scorer); }
          scorer.hidden = false; document.body.style.overflow = 'hidden';
          drawStation();
        }
        function closeScorer(force) {
          if (!force && run && run.history.length && !confirm('End this test? Shots so far won’t be saved.')) return;
          scorer.hidden = true; document.body.style.overflow = ''; run = null;
        }
        function record(v) {
          var st = STATIONS[run.idx], arr = run.shots[st.id];
          if (arr.length >= 10) return;
          arr.push(v); run.history.push(run.idx);
          if (navigator.vibrate) { try { navigator.vibrate(v ? 15 : 30); } catch (e) {} }
          drawStation();
        }
        function undo() {
          if (!run.history.length) return;
          var i = run.history.pop(); run.idx = i; run.shots[STATIONS[i].id].pop(); drawStation();
        }
        function drawStation() {
          var st = STATIONS[run.idx], arr = run.shots[st.id], z = ZONES[st.type];
          var sum = summarize(run.shots);
          scorer.innerHTML = '';
          var prog = el('div', { class: 'sc-prog' });
          STATIONS.forEach(function (s, i) { prog.appendChild(el('i', { class: run.shots[s.id].length === 10 ? 'done' : i === run.idx ? 'cur' : '' })); });
          var dots = el('div', { class: 'sc-dots' });
          for (var i = 0; i < 10; i++) { var v = arr[i]; dots.appendChild(el('i', { class: v === undefined ? '' : 'p' + v, text: v === undefined ? '' : v === 0 ? '✕' : String(v) })); }
          var full = arr.length === 10, last = run.idx === STATIONS.length - 1;
          var btns = el('div', { class: 'sc-btns' });
          z.forEach(function (zone, k) { btns.appendChild(el('button', { class: 'sc-btn z' + (k + 1), type: 'button', disabled: full, on: { click: function () { record(k + 1); } } }, [zone[0] + ' · ' + (k + 1), el('small', { text: zone[1] })])); });
          btns.appendChild(el('button', { class: 'sc-btn miss', type: 'button', disabled: full, text: 'Miss', on: { click: function () { record(0); } } }));
          var stMakes = arr.filter(function (x) { return x > 0; }).length, stPts = arr.reduce(function (a, b) { return a + b; }, 0);
          scorer.appendChild(el('div', { class: 'sc-top' }, [el('span', { text: 'Station ' + (run.idx + 1) + ' of 10 · ' + sum.makes + ' / ' + sum.taken + ' made' }), el('button', { class: 'sc-x', type: 'button', text: 'End', on: { click: function () { closeScorer(false); } } })]));
          scorer.appendChild(prog);
          scorer.appendChild(el('div', { class: 'sc-name', text: st.name }));
          scorer.appendChild(el('div', { class: 'sc-sub', text: st.sub }));
          scorer.appendChild(dots);
          scorer.appendChild(el('div', { class: 'sc-live' }, [el('span', { text: 'Shot ' + Math.min(arr.length + 1, 10) + ' of 10' }), el('span', { text: stMakes + ' made · ' + stPts + ' pts' })]));
          scorer.appendChild(btns);
          scorer.appendChild(el('div', { class: 'sc-row' }, [
            el('button', { class: 'sc-ghost', type: 'button', text: 'Undo', disabled: !run.history.length, on: { click: undo } }),
            el('button', { class: 'sc-ghost', type: 'button', text: last ? 'Finish test' : 'Next station', disabled: !full, on: { click: function () {
              if (last) finish(); else { run.idx++; drawStation(); }
            } } })
          ]));
        }
        function finish() {
          var sum = summarize(run.shots), shots = run.shots;
          scorer.innerHTML = '';
          var status = el('p', { class: 'saved', text: 'Saving…', style: 'text-align:center;color:#9a9a9a' });
          scorer.appendChild(el('div', { class: 'sc-top' }, [el('span', { text: 'Test complete' }), el('span')]));
          scorer.appendChild(el('div', { class: 'rc-big' }, [el('b', { text: String(sum.makes) }), el('span', { text: 'out of 100 made' })]));
          scorer.appendChild(el('div', { class: 'rc-grid' }, [
            el('div', { class: 't100-stat' }, [el('b', { text: sum.makes + '%' }), el('span', { text: 'Made' })]),
            el('div', { class: 't100-stat' }, [el('b', { text: String(sum.points) }), el('span', { text: 'Pts / 300' })]),
            el('div', { class: 't100-stat' }, [el('b', { text: String(sum.ovr) }), el('span', { text: 'OVR' })])
          ]));
          STATIONS.forEach(function (st) {
            var a = shots[st.id], m = a.filter(function (x) { return x > 0; }).length, p = a.reduce(function (x, y) { return x + y; }, 0);
            scorer.appendChild(el('div', { class: 'rc-st' }, [el('span', { text: st.name + ' · ' + st.sub }), el('em', { text: m + '/10 · ' + p + ' pts' })]));
          });
          scorer.appendChild(status);
          var done = el('button', { class: 'btn', type: 'button', text: 'Done', style: 'width:100%;margin-top:10px', on: { click: function () { closeScorer(true); render(); } } });
          scorer.appendChild(done);
          var save = function () {
            status.textContent = 'Saving…';
            call({ action: 'ip_test_save', shots: shots, scored_by: /[?&#]coach=1/.test(location.href) ? 'coach' : 'player' }).then(function (r) {
              if (r.status === 200) { tests.push(Object.assign({ scored_by: /[?&#]coach=1/.test(location.href) ? 'coach' : 'player' }, r.body.result)); status.textContent = 'Saved to your record.'; }
              else { status.textContent = 'Couldn’t save. '; status.appendChild(el('button', { class: 'sc-ghost', type: 'button', text: 'Try again', on: { click: save } })); }
            }).catch(function () { status.textContent = 'No connection. '; status.appendChild(el('button', { class: 'sc-ghost', type: 'button', text: 'Try again', on: { click: save } })); });
          };
          save();
        }

        var overallBar, overallTxt;
        function updateOverall() {
          var total = blocks().length * SESSIONS, done = 0;
          blocks().forEach(function (b) { done += doneCount(b.key); });
          overallBar.style.width = Math.round(100 * done / total) + '%';
          overallTxt.firstChild.textContent = done + ' of ' + total + ' sessions complete';
        }

        function render() {
          Array.prototype.slice.call(app.children, 1).forEach(function (n) { n.remove(); });
          overallBar = el('i');
          overallTxt = el('div', { class: 'overall-txt' }, [el('span'), el('span', { text: '10 sessions per section' })]);
          app.appendChild(testCard());
          app.appendChild(el('div', { class: 'overall' }, [el('div', { class: 'bar' }, [overallBar]), overallTxt]));
          PROGRAM.forEach(function (g) {
            app.appendChild(el('h2', { class: 'group', text: g.group }));
            g.blocks.forEach(function (b) { app.appendChild(blockEl(b)); });
          });
          app.appendChild(el('footer', { text: 'Phase Play Hoops · Questions? Text Coach Michael at 541-531-0150' }));
          updateOverall();
        }

        // Demo videos (YouTube Shorts), one per block. Pickup and Pullup share one.
        var VIDEOS = {
          stationary: { id: 'Ztj9f350e5s', title: '2-Ball Stationary Ball Handling' },
          motion: { id: 'bbVWm5ZqNy4', title: 'Motion Dribbling Combos' },
          pickup: { id: 'sNXPICwk51c', title: 'Pickup & Pull-up Shooting' },
          pullup: { id: 'sNXPICwk51c', title: 'Pickup & Pull-up Shooting' },
          finishing: { id: 'mXTQY-Tu42I', title: 'Rollup Rip Finishes' },
          passing: { id: 'RuKATjX7nbs', title: 'Dribble Catch Passing' }
        };
        var watching = {};
        function watchEl(b) {
          var v = VIDEOS[b.key];
          if (!v) return null;
          var wrap = el('div');
          var btn = el('button', { type: 'button', class: 'watch', 'aria-expanded': 'false' }, [el('span', { class: 'play', 'aria-hidden': 'true', text: '▶' }), el('span', { class: 'watch-txt', text: 'Watch the demo · ' + v.title })]);
          var box = el('div', { class: 'vid', hidden: '' });
          function show(on) {
            watching[b.key] = on;
            btn.classList.toggle('on', on);
            btn.setAttribute('aria-expanded', on ? 'true' : 'false');
            btn.querySelector('.watch-txt').textContent = (on ? 'Hide the demo · ' : 'Watch the demo · ') + v.title;
            box.hidden = !on;
            box.innerHTML = '';
            // The video only loads when opened, so the page stays fast.
            if (on) box.appendChild(el('div', { class: 'vid-frame' }, [el('iframe', {
              src: 'https://www.youtube-nocookie.com/embed/' + v.id + '?playsinline=1&rel=0&modestbranding=1&loop=1&playlist=' + v.id + '&autoplay=1',
              title: v.title + ' — demo video', allow: 'autoplay; encrypted-media; picture-in-picture; fullscreen', allowfullscreen: '', loading: 'lazy',
              // The page sends no referrer (keeps player names private), but YouTube refuses to play
              // without one (error 153). Send only the site address: no player name or code.
              referrerpolicy: 'strict-origin'
            })]));
          }
          btn.addEventListener('click', function () { show(!watching[b.key]); });
          wrap.appendChild(btn); wrap.appendChild(box);
          if (watching[b.key]) show(true);
          return wrap;
        }

        function blockEl(b) {
          var card = el('section', { class: 'block', id: 'b-' + b.key });
          var count = el('span', { class: 'block-count' });
          function setCount() { count.textContent = doneCount(b.key) + ' / ' + SESSIONS; }
          setCount();
          var head = el('button', { class: 'block-head', type: 'button', 'aria-expanded': open[b.key] ? 'true' : 'false', on: { click: function () { open[b.key] = !open[b.key]; card.replaceWith(blockEl(b)); } } },
            [el('span', { class: 'block-title', text: b.title }), count, el('span', { class: 'block-focus', text: b.focus })]);
          var pills = el('div', { class: 'sessions', role: 'group', 'aria-label': b.title + ' sessions' });
          for (var i = 1; i <= SESSIONS; i++) (function (n) {
            var s = sess(b.key, n);
            pills.appendChild(el('button', {
              type: 'button', class: 's' + (s.completed_on ? ' done' : '') + (open[b.key] && selected[b.key] === n ? ' sel' : ''),
              title: s.completed_on ? 'Session ' + n + ' — done ' + fmt(s.completed_on) : 'Session ' + n,
              'aria-label': 'Session ' + n + (s.completed_on ? ', completed ' + fmt(s.completed_on) : ''),
              text: String(n),
              on: { click: function () { selected[b.key] = n; open[b.key] = true; card.replaceWith(blockEl(b)); } }
            }));
          })(i);
          card.appendChild(head);
          var w = watchEl(b);
          if (w) card.appendChild(w);
          card.appendChild(pills);
          if (open[b.key]) card.appendChild(bodyEl(b, setCount));
          return card;
        }

        var saveTimers = {};
        function save(b, n, statusEl) {
          var s = sess(b.key, n);
          if (b.levels && !s.level) s.level = lvlOf(b, n);
          statusEl.textContent = 'Saving…';
          var tk = b.key + ':' + n;
          clearTimeout(saveTimers[tk]);
          saveTimers[tk] = setTimeout(function () {
            call({ action: 'ip_save', block: b.key, session_no: n, level: s.level || null, completed_on: s.completed_on, drills: s.drills, test_score: s.test_score, notes: s.notes })
              .then(function (r) { statusEl.textContent = r.status === 200 ? 'Saved' : 'Couldn’t save — try again'; })
              .catch(function () { statusEl.textContent = 'Couldn’t save — check your connection'; });
          }, 500);
        }

        function bodyEl(blk, setCount) {
          var n = selected[blk.key] || 1, s = sess(blk.key, n), b = view(blk, n);
          var status = el('span', { class: 'saved' });
          var body = el('div', { class: 'body' });
          body.appendChild(el('div', { class: 'sess-head' }, [el('b', { text: 'Session ' + n + ' of ' + SESSIONS }), el('span', { text: s.completed_on ? (s.drills.length < totalDrills(b) ? 'Submitted ' + fmt(s.completed_on) + ' · ' + s.drills.length + ' of ' + totalDrills(b) + ' drills' : 'Completed ' + fmt(s.completed_on)) : 'Not done yet' })]));
          if (blk.levels) {
            var cur = lvlOf(blk, n);
            body.appendChild(el('div', { class: 'lvl', role: 'group', 'aria-label': 'Level' }, [1, 2].map(function (L) {
              return el('button', { type: 'button', class: L === cur ? 'on' : '', 'aria-pressed': L === cur ? 'true' : 'false', disabled: !!s.completed_on && L !== cur,
                text: 'Level ' + L + ' · ' + blk.levels[L].name, on: { click: function () {
                  if (L === cur || s.completed_on) return;
                  if (s.drills.length && !confirm('Switch to ' + blk.levels[L].name + '? The drills you checked in this session will be cleared.')) return;
                  s.level = L; s.drills = [];
                  save(blk, n, status);
                  document.getElementById('b-' + blk.key).replaceWith(blockEl(blk));
                } } });
            })));
          }
          if (b.sets) body.appendChild(el('p', { class: 'sets', text: b.sets }));
          var idx = 0;
          b.cols.forEach(function (c) {
            if (c.label) body.appendChild(el('div', { class: 'col-label', text: c.label }));
            var ul = el('ul', { class: 'drills' });
            c.drills.forEach(function (d) {
              var i = idx++, parts = d.split('|');
              var box = el('input', { type: 'checkbox', checked: s.drills.indexOf(i) !== -1, on: { change: function () {
                var at = s.drills.indexOf(i);
                if (box.checked && at === -1) s.drills.push(i); else if (!box.checked && at !== -1) s.drills.splice(at, 1);
                save(blk, n, status); refreshDone();
              } } });
              ul.appendChild(el('li', {}, [el('label', {}, [box, el('span', {}, [el('span', { class: 'reps', text: parts[0] }), ' ' + parts[1]])])]));
            });
            body.appendChild(ul);
          });
          if (b.test) {
            var score = el('input', { type: 'number', min: '0', max: '10', inputmode: 'numeric', value: s.test_score == null ? '' : String(s.test_score), on: { change: function () {
              var v = score.value === '' ? null : Math.max(0, Math.min(10, parseInt(score.value, 10) || 0));
              s.test_score = v; if (v != null) score.value = v;
              save(blk, n, status);
            } } });
            body.appendChild(el('div', { class: 'test' }, [el('label', { text: b.test }), score, ' / 10']));
          }
          var notes = el('textarea', { placeholder: 'Workout notes (optional)', 'aria-label': 'Workout notes' });
          notes.value = s.notes || '';
          notes.addEventListener('input', function () { s.notes = notes.value; save(blk, n, status); });
          body.appendChild(el('div', { class: 'col-label', text: 'Workout notes' }));
          body.appendChild(notes);
          var total = totalDrills(b);
          var hint = el('p', { class: 'hint' });
          var done = el('button', { type: 'button', on: { click: function () {
            s.completed_on = s.completed_on ? null : today();
            save(blk, n, status);
            if (s.completed_on && n < SESSIONS) selected[blk.key] = n + 1;
            setCount(); updateOverall();
            var card = document.getElementById('b-' + blk.key);
            card.replaceWith(blockEl(blk));
          } } });
          function refreshDone() {
            var c = s.drills.length, all = c >= total;
            done.className = 'btn' + (s.completed_on ? ' alt' : '');
            if (s.completed_on) { done.textContent = 'Mark not done'; hint.hidden = true; return; }
            done.textContent = all ? 'Complete session ' + n : 'Submit session ' + n + ' (' + c + ' of ' + total + ' drills)';
            hint.hidden = all;
            hint.textContent = 'Out of time or stuck on a drill? Submit what you got done. It still counts, and you can come back to it.';
          }
          refreshDone();
          body.appendChild(el('div', { class: 'row' }, [done, status]));
          body.appendChild(hint);
          return body;
        }
      })();
    </script>
  </body>
</html>
