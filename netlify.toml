[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

# Named Interphase links: /interphase/billy-nunes#k=TOKEN loads the app.
# The name is only a label; the #k= code is what opens the player's record.
[[redirects]]
  from = "/interphase/*"
  to = "/interphase/index.html"
  status = 200

# Day 2 team links: /team/billy-nunes#k=CODE loads the family's team page.
# The name is only a label; the #k= code (the player's private link code) decides what it shows.
[[redirects]]
  from = "/team/*"
  to = "/team/index.html"
  status = 200

# Post-camp feedback: /feedback/billy-nunes#k=CODE ties answers to that player (same code as the Interphase link).
# /feedback/ with no code asks for the player's name. /feedback/results.html is the coach view (real file, not redirected).
[[redirects]]
  from = "/feedback/*"
  to = "/feedback/index.html"
  status = 200
