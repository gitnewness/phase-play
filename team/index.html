<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="no-referrer" />
    <meta name="color-scheme" content="light" />
    <title>Day 2 Team - Phase Play</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root { --ink: #161616; --ink-soft: #404040; --ink-faint: #6f6f6f; --line: #e3e3e3; --orange: #e85d04; --orange-deep: #c24e02; --orange-soft: #fbe3cf; }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body { margin: 0; background: #fff; color: var(--ink); font-family: "Barlow", system-ui, sans-serif; font-size: 17px; line-height: 1.45; }
      .wrap { max-width: 560px; margin: 0 auto; padding: 0 24px 48px; }
      header { padding: 26px 0 6px; }
      .kicker { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .14em; font-size: 14px; color: var(--orange-deep); margin: 0; }
      h1 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: clamp(38px, 11vw, 54px); line-height: .95; margin: 4px 0 6px; }
      .lede { color: var(--ink-soft); margin: 0; }
      .card { border: 1px solid var(--line); border-top: 4px solid var(--orange); border-radius: 0 0 10px 10px; padding: 16px; margin-top: 18px; }
      .card .day { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; font-size: 13px; color: var(--orange-deep); }
      .card h2 { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 26px; line-height: 1; margin: 6px 0 4px; }
      .card p { margin: 0; color: var(--ink-soft); }
      .team { display: inline-block; margin-top: 12px; padding: 8px 16px; border-radius: 999px; background: var(--orange); color: #fff; font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; font-size: 22px; }
      .slots { list-style: none; padding: 0; margin: 12px 0 0; }
      .slots li { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
      .slots b { font-weight: 700; }
      .wait { margin-top: 10px; color: var(--ink-faint); }
      .err { color: #b42318; font-weight: 600; margin-top: 18px; }
      .res-h { font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 30px; line-height: 1; margin: 34px 0 0; }
      .res-sub { color: var(--ink-faint); margin: 4px 0 0; font-size: 15px; }
      .vp { display: flex; align-items: center; gap: 14px; margin-top: 14px; padding: 12px 14px; background: var(--orange-soft); border-radius: 10px; }
      .vp-n { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 44px; line-height: 1; color: var(--orange-deep); }
      .vp-l { font-weight: 700; font-size: 15px; line-height: 1.2; }
      .vp-l small { display: block; font-weight: 500; color: var(--ink-soft); }
      .grade { margin-left: auto; max-width: 48%; text-align: center; background: var(--orange); color: #fff; border-radius: 10px; padding: 7px 12px; }
      .grade b { display: block; font-family: "Barlow Condensed", sans-serif; font-weight: 800; text-transform: uppercase; font-size: 21px; line-height: 1.05; }
      .grade span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; }
      .focus { margin: 10px 0 0; padding: 10px 12px; border-left: 4px solid var(--orange); background: #fafafa; font-weight: 600; font-size: 15px; color: var(--ink); }
      .ladder { list-style: none; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
      .ladder li { display: flex; flex-direction: column; justify-content: center; min-height: 44px; padding: 5px 3px; border-radius: 8px; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; background: #f1f1f1; color: var(--ink-faint); }
      .ladder li.done { background: var(--orange-soft); color: var(--orange-deep); }
      .ladder li.now { background: var(--orange); color: #fff; }
      .ladder li.next { background: #fff; color: var(--orange-deep); box-shadow: inset 0 0 0 1.5px var(--orange); }
      .ladder small { display: block; margin-top: 2px; font-size: 9px; letter-spacing: .08em; opacity: .85; }
      .ranks2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; margin-top: 10px; }
      .rank { padding: 9px 12px; border: 1.5px solid var(--orange); border-radius: 10px; }
      .rank span { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; white-space: nowrap; color: var(--ink-faint); }
      .rank b { font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 28px; line-height: 1.05; color: var(--orange-deep); }
      .rank small { margin-left: 5px; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
      .badges { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
      .badge { display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 999px; background: #161616; color: #fff; font-weight: 700; font-size: 14px; }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
      .stat { background: #fff; padding: 9px 10px; box-shadow: 0 0 0 .5px var(--line); }
      .stat b { display: block; font-family: "Barlow Condensed", sans-serif; font-weight: 800; font-size: 24px; line-height: 1.05; }
      .stat span { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); }
      .stat small { font-size: 13px; color: var(--ink-soft); font-weight: 600; }
      .key { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 2px 0; font-size: 13px; color: var(--ink-soft); }
      .key em { font-style: normal; font-size: 12px; font-weight: 800; color: var(--orange-deep); margin-right: 4px; }
      .note { margin: 12px 0 0; padding: 12px 14px; border-radius: 10px; background: #161616; color: #fff; }
      .card .note p { margin: 0; color: #fff; font-size: 16px; font-weight: 500; line-height: 1.4; }
      .note span { display: block; margin-bottom: 4px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .12em; color: #ffb27a; }
      .stat em { display: block; margin-top: 3px; font-style: normal; font-size: 12px; font-weight: 800; color: var(--orange-deep); }
      .stat em.minus { color: var(--ink-faint); }
      .film { display: block; margin-top: 14px; padding: 13px 16px; border-radius: 10px; background: var(--ink); color: #fff; text-align: center; text-decoration: none; font-weight: 700; font-size: 17px; }
      footer { margin-top: 36px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--ink-faint); }
      footer a { color: var(--ink); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <header>
        <p class="kicker">Michael Nunes presents Phase Play</p>
        <h1 id="h">Day 2 Team</h1>
        <p class="lede" id="lede">Loading…</p>
      </header>
      <div id="app"></div>
      <footer>Questions? Text Coach Michael at <a href="sms:+15415310150" style="white-space:nowrap">541-531-0150</a>.<br />Phase Play Hoops, 2026</footer>
    </main>
    <script>
      // A family's private Day 2 team page: /team/<name>#k=<code>. Shows only this player's own team
      // and game times, and only after Coach Michael publishes that game's teams.
      (function () {
        var API = 'https://yubopkxclvupxbeouhiu.supabase.co/functions/v1/phase-play';
        var app = document.getElementById('app'), lede = document.getElementById('lede'), h = document.getElementById('h');
        function el(tag, attrs, kids) {
          var n = document.createElement(tag);
          Object.keys(attrs || {}).forEach(function (k) { if (k === 'text') n.textContent = attrs[k]; else n.setAttribute(k, attrs[k]); });
          (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
          return n;
        }
        // Day 2 results: one card per game, in game order (stats, Value Points + level, Next focus, badges, film).
        var BADGE = { 'Bucket Getter': '\uD83E\uDEA3', 'Board Hog': '\uD83D\uDC17', 'Dime Dealer': '\uD83E\uDE99', 'Ball Thief': '\uD83E\uDD77',
          'No Fly Zone': '\uD83D\uDEAB', 'Brick Wall': '\uD83E\uDDF1', 'Disruptor': '\uD83D\uDCA5', 'Hustle Hero': '\uD83D\uDD25',
          'Sniper': '\uD83C\uDFAF', 'Downtown': '\uD83C\uDF07', 'Automatic': '\uD83E\uDD16' };
        function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
        function pct(m, a) { return a > 0 ? Math.round((m / a) * 100) + '%' : ''; }
        // vp: this stat's share of Value Points, shown as a small "+10 VP" line (left off when 0).
        function stat(label, value, extra, vp) {
          var v = Math.round(num(vp) * 10) / 10;
          return el('div', { class: 'stat' }, [el('b', { text: String(value) }), el('span', { text: label }), extra ? el('small', { text: ' ' + extra }) : null,
            v ? el('em', v < 0 ? { class: 'minus', text: '\u2212' + (-v) + ' VP' } : { text: '+' + v + ' VP' }) : null]);
        }
        // Level = player's VP / top VP in that game (exact ratio, never shown as a percentage).
        var LEVELS = [[0.8, 'Locked In'], [0.6, 'Heating Up'], [0.4, 'Finding Your Game'], [0.2, 'Warming Up'], [0, 'Getting Started']];
        function levelIdx(ratio) { for (var i = 0; i < LEVELS.length - 1; i++) if (ratio >= LEVELS[i][0]) return i; return LEVELS.length - 1; }
        function focusLine(vp, top, i) {
          var next = LEVELS[i - 1], gap = next[0] * top - vp, best = null;
          [['reb', 2, 'board', 'boards', 'rebounds'], ['defl', 1, 'deflection', 'deflections', 'deflections'], ['hustle', 1, 'hustle play', 'hustle plays', 'hustle']].forEach(function (h) {
            var n = Math.max(1, Math.ceil(gap / h[1] - 1e-9));
            if (!best || n < best.n) best = { n: n, h: h };
          });
          var WORDS = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten'];
          var what = (WORDS[best.n] || best.n) + ' more ' + (best.n === 1 ? best.h[2] : best.h[3]);
          return 'Next focus: ' + best.h[4] + ' \u2014 ' + what + " and you're " + next[1] + '.';
        }
        function showResults(list) {
          if (!list.length) return;
          app.appendChild(el('h2', { class: 'res-h', text: 'Results' }));
          app.appendChild(el('p', { class: 'res-sub', text: 'Game stats, Value Points, badges and game film.' }));
          list.forEach(function (g) {
            var r = g.result, s = r.stats || {};
            var vp = num(r.value_points), top = num(s.top_vp);
            var ratio = top > 0 ? vp / top : num(r.grade) / 100, li = levelIdx(ratio), isTop = top > 0 ? vp >= top : ratio >= 1;
            var card = el('section', { class: 'card' }, [
              el('div', { class: 'day', text: g.day }),
              el('h2', { text: g.title }),
              el('p', { text: g.time }),
              el('div', { class: 'vp' }, [
                el('div', { class: 'vp-n', text: String(vp) }),
                el('div', { class: 'vp-l', text: 'Value Points' }),
                el('div', { class: 'grade' }, [el('b', { text: LEVELS[li][1] }), el('span', { text: 'Level' })])
              ])
            ]);
            // Level pills, Getting Started → Locked In: where the player is now and the next level up.
            card.appendChild(el('ol', { class: 'ladder', 'aria-label': 'Levels' }, LEVELS.slice().reverse().map(function (L, j) {
              var idx = LEVELS.length - 1 - j, cls = idx === li ? 'now' : idx === li - 1 ? 'next' : idx > li ? 'done' : '';
              return el('li', cls ? { class: cls } : {}, [L[1], cls === 'now' ? el('small', { text: 'You' }) : cls === 'next' ? el('small', { text: 'Next' }) : null]);
            })));
            if (isTop) card.appendChild(el('p', { class: 'focus', text: 'Top Value Points in this game' }));
            else if (li > 0 && top > 0) card.appendChild(el('p', { class: 'focus', text: focusLine(vp, top, li) }));
            // VP rank on the team and overall in the game; each box shows only for a top-5 place.
            // Coach's note: one line from Coach Michael, saved as stats.coach_note. Shown only when set.
            if (typeof s.coach_note === 'string' && s.coach_note.trim()) {
              card.appendChild(el('div', { class: 'note' }, [el('span', { text: "Coach's note" }), el('p', { text: s.coach_note.trim() })]));
            }
            var rboxes = [['Team VP rank', s.team_rank, s.team_of], ['Overall VP rank', s.rank, s.of]].filter(function (x) {
              return num(x[1]) >= 1 && num(x[1]) <= 5;
            }).map(function (x) {
              return el('div', { class: 'rank' }, [el('span', { text: x[0] }), el('b', { text: '#' + num(x[1]) }), num(x[2]) ? el('small', { text: 'of ' + num(x[2]) }) : null]);
            });
            if (rboxes.length) card.appendChild(el('div', { class: 'ranks2' }, rboxes));
            var badges = (r.badges || []).filter(function (x) { return typeof x === 'string' && x; });
            if (badges.length) card.appendChild(el('div', { class: 'badges' }, badges.map(function (x) {
              return el('span', { class: 'badge' }, [BADGE[x] ? el('span', { 'aria-hidden': 'true', text: BADGE[x] }) : null, x]);
            })));
            var fgm = num(s.fgm), fga = num(s.fga), tpm = num(s.tpm), tpa = num(s.tpa), ftm = num(s.ftm), fta = num(s.fta);
            var W = { pts: 1, reb: 2, ast: 2.5, stl: 3, chg: 5, blk: 2.5, defl: 1, hustle: 1 }, plus = 0;
            Object.keys(W).forEach(function (k) { plus += num(s[k]) * W[k]; });
            var toVp = num(s.to) ? Math.min(0, vp - plus) : 0; // turnover cost = whatever the game's tier took off
            function v(k) { return num(s[k]) * W[k]; }
            card.appendChild(el('div', { class: 'stats' }, [
              stat('Points', num(s.pts), '', v('pts')),
              stat('FG', fgm + '/' + fga, pct(fgm, fga)),
              stat('3PT', tpm + '/' + tpa, pct(tpm, tpa)),
              stat('FT', ftm + '/' + fta, pct(ftm, fta)),
              stat('Rebounds', num(s.reb), '', v('reb')),
              stat('Assists', num(s.ast), '', v('ast')),
              stat('Steals', num(s.stl), '', v('stl')),
              stat('Blocks', num(s.blk), '', v('blk')),
              stat('Deflections', num(s.defl), '', v('defl')),
              stat('Hustle', num(s.hustle), '', v('hustle')),
              num(s.chg) ? stat('Charges', num(s.chg), '', v('chg')) : null,
              stat('Turnovers', num(s.to), '', toVp)
            ]));
            card.appendChild(el('div', { class: 'key' }, [el('span', {}, [el('em', { text: '+5 VP' }), 'Value Points that stat earned'])]));
            if (typeof r.film_url === 'string' && /^https:\/\/(www\.)?(youtube\.com|youtu\.be)\//.test(r.film_url)) {
              card.appendChild(el('a', { class: 'film', href: r.film_url, target: '_blank', rel: 'noopener noreferrer', text: '\u25B6 Watch game film' }));
            }
            app.appendChild(card);
          });
        }
        var m = /[#&]k=([A-Za-z0-9]+)/.exec(location.hash || '');
        if (!m) { lede.textContent = ''; app.appendChild(el('p', { class: 'err', text: 'This link is missing its code. Please use the full link Coach Michael sent you.' })); return; }
        fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'my_team', token: m[1] }) })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, body: j }; }); })
          .then(function (r) {
            if (!r.ok || !r.body.games) { lede.textContent = ''; app.appendChild(el('p', { class: 'err', text: 'This link is not working. Please text Coach Michael.' })); return; }
            var b = r.body;
            h.textContent = b.player + "'s Day 2";
            lede.textContent = 'Tuesday, November 24 · Athletic Club of Bend';
            if (!b.games.length) { app.appendChild(el('p', { class: 'wait', text: b.player + ' is not in a Day 2 game.' })); return; }
            b.games.forEach(function (g) {
              var card = el('section', { class: 'card' }, [
                el('div', { class: 'day', text: g.day }),
                el('h2', { text: g.title }),
                el('p', { text: g.time + (g.who ? ' · ' + g.who : '') })
              ]);
              if (g.published) {
                card.appendChild(el('div', { class: 'team', text: g.team }));
                if (g.slots && g.slots.length) {
                  card.appendChild(el('ul', { class: 'slots' }, g.slots.map(function (s) {
                    return el('li', {}, [el('b', { text: s.label + ' · ' + s.time }), el('span', { text: 'vs ' + s.opponent })]);
                  })));
                }
              } else {
                card.appendChild(el('p', { class: 'wait', text: 'Teams are not posted yet. Check back on this link.' }));
              }
              app.appendChild(card);
            });
            showResults(b.games.filter(function (g) { return g.result; }));
          })
          .catch(function () { lede.textContent = ''; app.appendChild(el('p', { class: 'err', text: 'No connection. Please try again.' })); });
      })();
    </script>
  </body>
</html>
